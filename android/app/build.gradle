plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jianchi.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.jianchi.app"
        minSdk 26          // Android 8.0+(2017),覆盖 iQOO Neo 7 / Android 16
        targetSdk 35
        versionCode 2
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
